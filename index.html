תואם את מה שהוצג בהרצאה?","o":["קביעת מועד העלייה לאוויר באופן אוטומטי על ידי מודל AI, כדי לנטרל את ההטיות של צוות ההנהלה","החלפת תהליך ניהול השינוי בעוזר AI, כך שלא יהיה צורך בהדרכות ובמעורבות של מנהלי המשמרות בשטח","הרצת תרחישי עומס בתאום דיגיטלי לפני העלייה, ואיתור מוקדם של עובדים ותחנות שמתקשים במערכת","קיצור שלב הבדיקות, משום שמודל AI יכול לזהות ולתקן בעצמו את כל תקלות המערכת לאחר העלייה"],"c":2,"e":"בהרצאה הוצגו שלושה שימושים: תאומים דיגיטליים (Digital Twins) – סימולציות להרצת תרחישי עומס לפני ה-Go-Live; בינה מלאכותית הקשרית (Contextual AI) – עוזרים במסופונים שמדריכים את העובד בזמן אמת; ואימוץ חזוי (Predictive Adoption) – זיהוי מוקדם של עובדים או תחנות שנתקעים במערכת לפני שנוצר עיכוב. הבינה המלאכותית הוצגה כזרז וכמפחיתת סיכונים לצד ניהול השינוי – לא כתחליף לו, לשיקול הדעת הניהולי או לבדיקות."},{"t":"הרצאה 9 · הטמעת טכנולוגיות","s":"מצגת","q":"מדוע כשל של מערכת המידע במעבר למערכת חדשה בחברה להפצת תרופות חמור, בדרך כלל, מכשל דומה בחברה המפיצה מוצרי צריכה יבשים?","o":["בחברות תרופות המערכות מורכבות יותר, ולכן זמן הפיתוח שלהן ארוך יותר והעלייה לאוויר נדחית בתדירות גבוהה","המערכת היא חלק מהבקרה הרגולטורית – טמפרטורה, אצוות ושחרור מהסגר – ובלעדיה לא ניתן לאשר הפצה","בחברות תרופות אין אפשרות לעבוד באופן ידני כלל, משום שהרגולציה אוסרת כל פעולה שאינה ממוחשבת במלואה","תרופות יקרות יותר ממוצרי צריכה, ולכן כל עיכוב בהפצתן גורם להפסד כספי גבוה יותר לחברת ההפצה עצמה"],"c":1,"e":"בהרצאה תואר ההקשר התפעולי של הפצת תרופות: תקני cGMP/GDP, בקרת טמפרטורה, ניהול אצוות ו'אפס סובלנות לטעויות'. כשהמערכת כשלה לא ניתן היה לדעת אם פריט מלוקט מאושר להוצאה, והשלכות הכשל הגיעו עד לבתי החולים. מחיר המוצר אינו העיקר; עבודה ידנית חלקית אכן בוצעה בתקופת המשבר; ומורכבות הפיתוח אינה מסבירה את חומרת התוצאה."},{"t":"הרצאה 9 · הטמעת טכנולוגיות","s":"הרצאה","q":"ברשת קמעונאות מלקט בחנות מבצע כ-10–12 הזמנות מקוונות ביום, בעוד שהביקוש המקוון הכולל מגיע לאלפי הזמנות ביום. הרשת מחליטה להשקיע סכומים גבוהים במרכזי שילוח אוטומטיים, אף שהפעילות המקוונת אינה רווחית. מהו ההיגיון האסטרטגי שהוצג בהרצאה?","o":["הפעילות המקוונת היא מנוע צמיחה ונאמנות, וליקוט ידני אינו ישים כלכלית בהיקף הנדרש","ההשקעה נועדה בעיקר לצמצם את מספר העובדים, ללא קשר להיקף הביקוש המקוון או לחוויית הלקוח","אוטומציה מאפשרת לסגור את כל החנויות הפיזיות ולהעביר את כלל הפעילות לערוץ המקוון בלבד","מרכזים אוטומטיים זולים יותר להקמה מחנויות חשוכות, ולכן הם השלב הראשון והטבעי בכל הטמעה"],"c":0,"e":"בהרצאה הוצג כי האונליין הוא מנוע צמיחה משמעותי, המאפשר נאמנות לקוחות ושירות נוסף, אף שהוא הפסדי. בקצב של 10–12 הזמנות למלקט ביום, מענה לביקוש של אלפי הזמנות יומיות בליקוט ידני אינו ישים, ולכן הרשת עברה בשלבים: ליקוט בחנות, חנויות חשוכות ומרכזים אוטומטיים. החנויות הפיזיות לא נסגרו, המטרה אינה צמצום עובדים בלבד, ומרכזים אוטומטיים הם השלב המתקדם והיקר – לא הראשון."},{"t":"הרצאה 9 · הטמעת טכנולוגיות","s":"הרצאה","q":"מערכת המידע התפעולית של חברת הפצה מגיעה לסוף חייה (End of Life), והספק הודיע שיפסיק לתמוך בה בתוך חצי שנה. פרויקט ההחלפה מתעכב, והעובדים מדווחים שאינם מוכנים. מדוע מצב זה מגביר את הסיכון בהטמעה?","o":["מערכת שהגיעה לסוף חייה אינה מאפשרת להסב ממנה נתונים, ולכן יש להזין מחדש ידנית את כל נתוני הבסיס","הוא מבטל בפועל את האפשרות להישאר במערכת הישנה או לחזור אליה, ויוצר לחץ לעלות לפני שהארגון מוכן","סוף חיי המערכת מחייב על פי חוק לעבור לספק אחר, ולכן לא ניתן להיעזר בידע שנצבר אצל הספק הקיים","העובדים יתנגדו למערכת החדשה רק משום שהישנה הפסיקה לעבוד, ולא בשל חוסר מוכנות אמיתי מצדם"],"c":1,"e":"בנובולוג הגיעה המערכת הקודמת לסוף חייה ולא יכלה לתמוך בפעילות, והמצב דחף להחלטה שגויה – להעלות את כל המודולים בבת אחת. כשאין מערכת ישנה יציבה, חלופת ההישארות וחלופת החזרה לאחור נחלשות, ולוח הזמנים מכתיב את ההחלטה במקום המוכנות. הסבת נתונים עדיין אפשרית, אין חובה חוקית להחליף ספק, וחוסר המוכנות של העובדים היה אמיתי."},{"t":"הרצאה 9 · הטמעת טכנולוגיות","s":"מצגת","q":"מערכת חדשה פעלה ללא תקלות בסביבת הבדיקות, אך בשבוע הראשון לאחר העלייה לאוויר נוצרו עיכובים כאשר נפח ההזמנות האמיתי זרם אליה. איזו סיבת שורש מהמקרה שנותח בהרצאה ממחיש הדבר, ומה היה מצמצם אותה?","o":["פער בין סביבת הבדיקות לעומס האמיתי; בדיקות עומס וסימולציית תרחישי שיא לפני העלייה היו חושפות אותו","התנגדות עובדים לשינוי; הדרכות נוספות לפני העלייה היו מונעות לחלוטין את העיכובים בנפח הפעילות הגבוה","מחסור בכוח אדם; גיוס עובדים זמניים לתקופת העלייה היה מפצה על כל מגבלות הביצועים של המערכת","בחירת ספק לא מתאים; מעבר לספק בינלאומי מוביל היה מבטיח שהמערכת תעמוד בכל עומס פעילות שיידרש ממנה"],"c":0,"e":"אחת משלוש סיבות השורש שהוצגו בניתוח כשל ההטמעה בנובולוג היא 'עומסי שיא: פער בין תפקוד המערכת בסביבת בדיקות לבין ביצועיה תחת תנועת מלאי אמיתית'. בדיקות עומס, ובכללן סימולציות בתאום דיגיטלי, נועדו לחשוף פערים כאלה מראש. שאר התשובות מציעות פתרון לבעיה אחרת, או מבטיחות תוצאה מוחלטת שאינה ריאלית."},{"t":"הרצאה 9 · הטמעת טכנולוגיות","s":"מצגת","q":"מרכז ליקוט אוטומטי הגדיל מאוד את התפוקה, אך כשהלקוחות שינו בבת אחת את הרגלי ההזמנה שלהם, התקשה המרכז להסתגל. איזה לקח מההרצאה ממחיש המקרה?","o":["כשל בבדיקות העומס – המערכת לא נבדקה בנפחים גבוהים לפני העלייה לאוויר","מלכודת הקסטומיזציה – ריבוי התאמות למשתמשים סיבך את המערכת והאט אותה","בעיית כוח אדם – העובדים לא הוכשרו לתפעל את המערכת במצבי חירום","אובדן גמישות – אוטומציה מגדילה תפוקה, אך מקשה להסתגל לשינויים מהירים"],"c":3,"e":"בין הלקחים ממרכזי הליקוט האוטומטיים הוצג 'אובדן גמישות: אוטומציה מגדילה תפוקה תיאורטית, אך מפחיתה יכולת הסתגלות לשינויים מהירים בשטח', לצד נתוני בסיס ואינטגרציית קצה. זה מתחבר לתפיסת החוסן של הקורס: יעילות מרבית אינה זהה ליכולת הסתגלות."},{"t":"הרצאה 9 · הטמעת טכנולוגיות","s":"הרצאה","q":"רשת קמעונאות חילקה ללקוחות פליירים על שירות המשלוחים החדש מהמרכז האוטומטי, אך בשבועות הראשונים קיבלו הלקוחות רק 70%–80% מההזמנה. מה ממחיש המקרה?","o":["פער בין הציפיות שנבנו לבין הביצועים – ושיעור מילוי נמוך פוגע באמון","שהלקוחות הזמינו יותר מדי פריטים, ולכן המערכת נאלצה להגביל את גודלה של כל הזמנה","שהפליירים יצרו עומס חריג, ולכן יש להימנע מכל שיווק לפני שינוי תפעולי בארגון","שמרכזים אוטומטיים אינם יכולים לספק יותר מ-80% מההזמנות בשום מצב"],"c":0,"e":"המרצה האורח תיאר כיצד 'הבשורה החדשה' שהוצגה ללקוחות התנגשה במציאות: הזמנות הגיעו חלקיות, בין היתר בגלל נתונים חסרים שמנעו מהמערכת לטפל בחלק מהפריטים, בעוד היעד היה 98%–99% הספקה. ציפייה שנבנתה מראש מגדילה את הפגיעה באמון כשהביצועים בעלייה לאוויר נמוכים."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"שאלות הכיתה","q":"ע\"פ המרצה (חברת ממן) חברות פועלות בקצבי זמן שונים בבואן לקבוע או לעדכן את האסטרטגיה שלהן. מהו ההבדל המרכזי המוצג בהרצאה בין תהליך התכנון של חברת אלביט לזה של חברת ממן?","o":["2 החברות זנחו לחלוטין את מודל הניתוח הקלאסי לטובת מודלים פיננסיים אחרים ומתקדמים כמו ניהול רזה ומודל פיננסי 5.0","אלביט פועלת לפי אסטרטגיה קשיחה ל-חודש קדימה וכל הזמן עוברת בספרינטים מהירים ואילו ממן משנה את יעדיה מדי חצי שנה באמצעות חברות ייעוץ חיצוניות","אלביט מגדירה אסטרטגיה בכל שנה מחדש, מכיוון שהסביבה העסקית של משתנה במהירות רבה, בעוד ממן מתכננת לטווח של 5 שנים אך נדרשת לבחון מחדש ולבצע התאמות בכל שלב בדרך","אלביט נצמדת לתוכנית חמש שנתית ואילו ממן מבצעת הערכה מחדש כל שנה בשל שינויים טכנולוגיים מהירים בעידן הגלובלי"],"c":2,"e":"ברזילי תיארה שאלביט בונה אסטרטגיה מחדש כל שנה, משום שעולמה משתנה מהר מדי לתוכנית חמש-שנתית — היא 'למדה בדרך הקשה' שהיא נאלצת לפתוח אותה כל שנה. ממן בונה אסטרטגיה לחמש שנים, אבל פותחת אותה בכל שנה, בוחנת 'האם עשיתי את זה נכון' ומבצעת שינויים תוך כדי תנועה. קצב השינוי בסביבה העסקית קובע כמה פעמים צריך לעדכן את האסטרטגיה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"קבוצה לוגיסטית שאינה פועלת כיום בשילוח בינלאומי קבעה באסטרטגיה החדשה שלה שתיכנס לתחום. מה מכאן והלאה תפקידו של הפיתוח העסקי?","o":["להציע שירותי שילוח ללקוחות הקיימים בלבד, כך שלא תידרש השקעה בתשתית חדשה","לנסח את החזון, הערכים והמיצוב של הקבוצה בתחום השילוח, לפני כל פעולה בשטח","לבחון מחדש אם להיכנס לשילוח בכלל, משום שהחלטת האסטרטגיה היא רק המלצה שאינה מחייבת","לבחור איך להיכנס — רכישת חברה, בנייה מאפס או מיזם משותף — ולהוציא את המהלך לפועל"],"c":3,"e":"ההבדל הודגם בהרצאה כך: האסטרטגיה קבעה להיכנס לעולם השילוח, ומכאן זרוע הפיתוח העסקי שואלת 'איך' — לקנות חברה, לפתח תשתית שילוח מאפס או לעשות מיזם משותף עם חברה אחרת. אסטרטגיה מגדירה את הבחירות, ופיתוח עסקי הופך אותן למנועי צמיחה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"קבוצה עם מחזור של כמיליארד וחצי ש״ח בשנה שוקלת להיכנס לתחום רווחי שהמחזור הצפוי בו כעשרה מיליון ש״ח בשנה. מה הבעיה בהצעה?","o":["המחזור קטן, ולכן אפשר להיכנס בלי להגדיר יעדי רווח ובלי לאשר את המהלך בדירקטוריון","התחום חדש לקבוצה, ולכן עדיף לחכות עד שהמתחרים ייכנסו אליו ראשונים וילמדו אותו","תחום רווחי מצדיק תמיד כניסה, ולכן הבעיה היחידה היא למצוא מנהל מתאים לתחום","המשאב הניהולי מוגבל וצריך לרכז אותו ב'אבנים הגדולות' — והתחום קטן מדי"],"c":3,"e":"כשמגדירים לאן רוצים להגיע צריך לקבוע איזה מחזור ואיזה רווח מצפים לראות מכל זירה אסטרטגית: לקבוצה בהיקף של כמיליארד וחצי ש״ח אין היגיון להיכנס לעסק של עשרה מיליון ש״ח בשנה, משום שיש משאב ניהולי שרוצים לרכז 'באבנים הגדולות'. בלי יעדים כאלה, לדברי ברזילי, אסטרטגיה 'הולכת לאיבוד'."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"בתוכנית ההשקעות הרב-שנתית של חברה לא יועד תקציב למנועי צמיחה, משום ש'זה תמיד סיכון'. כעבור שנה מזדמנת לה רכישה של חברת הפצה שמתאימה בדיוק לאסטרטגיה. מה צפוי לקרות?","o":["הרכישה תידחה, משום שחברה אינה רשאית לרכוש חברות בתקופה של תוכנית אסטרטגית","הרכישה תאושר מיד, משום שהזדמנות שתואמת את האסטרטגיה ממומנת תמיד מהתקציב השוטף","אין לכך השפעה, משום שרכישות ממומנות תמיד בהלוואות ולא מתקציב ההשקעות","הדירקטוריון עלול לומר שאין לכך כסף — ולכן היה צריך 'לצבוע' מראש תקציב לצמיחה"],"c":3,"e":"'לארגונים מאוד קשה לצבוע כסף במנועי צמיחה, כי זה תמיד סיכון' — אבל מי שלא עושה זאת יגיע יום אחד לדירקטוריון עם עסקה וישמע 'אין כסף'. לכן כבר בתקציב ההשקעות לשנה הבאה או לחמש השנים הבאות מסמנים כסף שמיועד למנועי הצמיחה. זה השלב 'מתרגמים לכסף': 'אסטרטגיה בלי הקצאת משאבים היא שאיפה, לא תוכנית'."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"מנכ״ל חדש עוצר מהלך של כניסה לתחום חדש, שקודמו קידם במשך שנה עם תקציב מאושר של עשרות מיליוני שקלים — בלי שנחתמה עסקה. איזה פירוש להחלטה תואם את התפיסה שהוצגה?","o":["המנכ״ל חייב להמשיך, משום שהדירקטוריון כבר אישר את התקציב ואין לו סמכות לעצור","זו טעות, משום שההשקעה של השנה האחרונה מחייבת להשלים את המהלך עד לחתימה על עסקה","העצירה מוצדקת רק אם המהלך כבר הפסיד כסף, ולא כשהוא פשוט עוד לא הבשיל לעסקה חתומה","עצירה היא החלטה אסטרטגית: מנכ״ל חדש בוחן מחדש, ולא מתחייב להשקעה שלא היה שותף לה"],"c":3,"e":"ברזילי גויסה לממן כדי להקים זרוע רפואית עם תקציב של 80 מיליון ש״ח. אחרי שנה, כשעסקאות היו קרובות לחתימה, המנכ״ל החדש עצר: הוא ביקש לבחון את האסטרטגיה מחדש, ולא לחתום על השקעה שלא היה שותף לה אחרי שנה בלי עסקה. 'עצירה היא גם החלטה אסטרטגית' — קשה וכואבת, אבל לגיטימית. העבודה לא נזרקה, אלא הועברה לחברות הבנות."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"בתחילת משבר, קבוצה שחצי מפעילותה בתעופה שלחה הביתה כ-1,500 עובדים כדי לשרוד. כעבור חודשים המחסנים התמלאו עד אפס מקום והתעופה חזרה בבת אחת — והקבוצה נאלצה לגייס מאות עובדים בזמן קצר. איזה לקח היא יישמה במשברים שבאו אחר כך?","o":["לסגור את הזרוע שנפגעה ולהעביר את כל העובדים לזרוע שצמחה במשבר","ידיים עובדות הן משאב נדיר, ולכן שמרה על העובדים גם במחיר של הפסד כספי","לשלוח עובדים הביתה מוקדם ככל האפשר בכל משבר, משום שגיוס מחדש מהיר וזול","להעסיק את כל העובדים דרך חברות כוח אדם, כדי לצמצם ולהרחיב בלי שום עלות"],"c":1,"e":"בחודשים הראשונים של הקורונה המשבר נראה לממן כאיום קיומי, והחברה שלחה כ-1,500 איש הביתה. אחר כך הלוגיסטיקה 'התפוצצה' והתעופה חזרה ביום אחד — ולא היו ידיים עובדות: הקבוצה גייסה מאות עובדים בזמן קצר, ובכירים עשו בעצמם צ'ק-אין לנוסעים. הלקח: 'אנחנו לא יכולים לאבד ידיים עובדות' — ובמלחמות שבאו אחר כך הקבוצה המשיכה לשלם לעובדיה במשך חודשים וספגה את ההפסד."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"זרוע התעופה של קבוצה לוגיסטית מתאוששת ורווחית לרבעון או שניים, ואז נסגרת שוב עם כל סגירת שמיים. היכן נכון להשקיע את תקציב הצמיחה, לפי ההיגיון של איזון זרועות?","o":["בזרוע בינלאומית בנישות מסוימות — כדי שתהיה זרוע יציבה גם כשהמציאות המקומית רועדת","באף תחום, משום שבתקופה של אי-ודאות נכון להקפיא את כל ההשקעות עד שהמצב הביטחוני יתבהר","בזרוע מסחר מקוון חדשה, משום שצמיחת השוק לבדה מבטיחה את רווחיות ההשקעה","בהגדלת זרוע התעופה, כדי לנצל עד תום את הרבעונים שבהם היא רווחית במיוחד"],"c":0,"e":"מאז הקורונה זרוע התעופה של ממן 'מדממת': מתאוששת, מרוויחה רבעון או שניים ונסגרת שוב עם כל סגירת שמיים. לכן, 'כדי לאזן את הזרועות', הקבוצה משקיעה בהתרחבות בינלאומית בנישות מסוימות — 'עוד זרוע יציבה, שגם כשהעולם פה רועד נוכל להישען עליה'. זה אותו עיקרון שהתגלה בקורונה: אותו משבר משפיע אחרת על כל זרוע."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"חברת בת היא הרווחית ביותר בקבוצה: לקוחותיה שומרים אצלה חומר לשנים ארוכות, בין השאר בגלל רגולציה. אבל הדיגיטציה מתקדמת, הרגולטור כבר מתיר לסרוק ולהשמיד, ושחקנים חדשים אינם נכנסים לתחום. מה המשמעות האסטרטגית?","o":["זה מנוע הצמיחה העיקרי של הקבוצה, ולכן כדאי להפנות אליו את רוב תקציב ההשקעות בשנים הקרובות","זה שוק מצטמק: החברה רווחית היום אך אינה מנוע צמיחה, ואת הצמיחה יש לחפש במקום אחר","זה שוק צומח, משום שהיעדר מתחרים חדשים מבטיח שהחברה תגדיל את נתח השוק שלה","אין לכך משמעות, משום שהרגולציה מחייבת את הלקוחות לשמור מסמכים בנייר לתמיד"],"c":1,"e":"ארכיב 2000 היא 'בפער' החברה הרווחית ביותר בממן: מסמכים נשמרים בה זמן רב, ויש רגולציה. אבל 'הנייר עולה ונעלם' — יש יותר דיגיטציה, והרגולטור מתיר היום לסרוק ולהשמיד. לכן 'עם הזמן היא תצטמצם', ו'גם לא נכנסים שחקנים חדשים לעולם הזה — הוא לא ייפתח, הוא רק יתכווץ'. רווחיות של היום אינה מנוע צמיחה של מחר."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"ניסוי POC של מלגזות אוטונומיות מצליח טכנית, אבל מתברר שהתאמת סביבת העבודה למלגזות יקרה בהרבה מהמתוכנן. מה צריך להכריע אם לעבור ליישום מסחרי?","o":["יש לוותר על הטכנולוגיה, משום שכל חריגה מתקציב הניסוי מעידה על פתרון לא בשל","יש להמשיך בניסויים עד שהמלגזות יעבדו בכל סביבה בלי שום התאמה של השטח","ההצלחה הטכנית בניסוי מספיקה, ולכן יש לעבור ליישום מסחרי בכל האתרים בבת אחת","חישוב ROI: עלות המלגזות והתאמת השטח מול עלות גיוס מלגזנים במחיר השוק"],"c":3,"e":"הניסוי נערך קודם במרלו״ג של קוקה-קולה, סביבה סטרילית יחסית, ורק אחר כך במסוף המטענים הכאוטי. המלגזות עבדו, אבל ההשקעה בהתאמת האזור הייתה גדולה בהרבה מהמתוכנן. לכן 'אתה צריך להראות ROI': אולי במחיר של 200 ש״ח לשעה יימצאו מלגזנים, ובמחיר של 70 לא — ואת המספרים האלה משווים לעלות המלגזה ולתשתית שנבנתה עבורה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"קבוצה מחזיקה 12 חברות בנות — לכל אחת מנכ״ל, הנהלה, דירקטוריון ואסטרטגיה משלה — ואילו המטה שלה מונה חמישה אנשים בלבד. מה תפקידו האסטרטגי העיקרי של המטה?","o":["לנהל בעצמו את הפעילות השוטפת של כל החברות הבנות, כדי שלא יפעלו בנפרד ובלי תיאום זו עם זו","להחליף את מנכ״לי החברות הבנות, כדי שכל ההחלטות יתקבלו במקום אחד בקבוצה","לזהות סינרגיה ולחבר יכולות של חברות שונות לערך קבוצתי, גם כשהאינטרסים שלהן מתנגשים","לאשר את התקציב של כל חברה בנפרד, בלי להתערב ביחסים שבין החברות לבין עצמן"],"c":2,"e":"בממן 'כל חברה יש לה מנכ״ל, הנהלה, דירקטוריון ואסטרטגיה משלה', והמטה בן חמישה אנשים: מנכ״ל הקבוצה, סמנכ״לית האסטרטגיה, כספים, משאבי אנוש וייעוץ משפטי. המטה צריך להתוות את הדרך לקבוצה שבה 'האינטרסים של החברות הבנות יכולים להתנגש', ו'לזהות מה הסינרגיה' — איפה אפשר לחבר את היכולות של חברה אחת ליכולות של אחרת ולהביא ערך לקבוצה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"שוק המסחר המקוון בישראל גדל משנה לשנה. קבוצה לוגיסטית בוחנת השקעה של 100 מיליון ש״ח בממיינת למשלוחים עד הבית, ומחליטה שלא להשקיע. מה יכול להצדיק את ההחלטה?","o":["צמיחה אינה מספיקה: הרווחיות למשלוח נמוכה מאוד, וחברה אחות בקבוצה כבר פועלת בתחום","ההשקעה קטנה מדי ביחס לקבוצה, ולכן אינה מצדיקה דיון בהנהלה ובדירקטוריון","חברה לוגיסטית אינה רשאית להפעיל ממיינת למשלוחים, משום שהתחום מוקצה לדואר בלבד","השוק צפוי להצטמק, משום שהצרכנים יחזרו לקנות בחנויות פיזיות כשתיגמר תקופת המשברים"],"c":0,"e":"בתרגיל שחתם את ההרצאה הסבירה ברזילי שהמסחר המקוון 'לא הוכיח את עצמו' עבור ממן — 'לא בגלל הגודל שלו, כי הוא הלך וגדל, אלא כי הרווחיות שם היא כל כך קטנה': משלוח לבית עולה כ-30 ש״ח. בנוסף, חברה אחות שבבעלות אותם בעלים כבר פועלת בתחום. צמיחת שוק לבדה אינה סיבה להשקיע; מכריעים לפי פוטנציאל הצמיחה, הסיכון, הרווחיות והיתרון התחרותי."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"סמנכ״לית מציגה לדירקטוריון אסטרטגיה חדשה בלי שיחות מקדימות עם הדירקטורים, ומופתעת מהתנגדות חריפה בישיבה. מה היה חסר בתהליך?","o":["מצגת ארוכה ומפורטת יותר, משום שדירקטוריון מאשר אסטרטגיה לפי כמות הנתונים שהוצגו לו","אישור מראש של היועץ המשפטי, משום שהוא שמכריע אם אסטרטגיה תאושר בדירקטוריון","דבר לא היה חסר — הדירקטוריון רק מאשר את מה שהמנכ״ל כבר החליט, ולכן ההתנגדות אינה חשובה","עבודה מקדימה: תיאום עם אנשי המפתח בדירקטוריון, כך שבישיבה עצמה אין הפתעות"],"c":3,"e":"ברזילי: 'אני לא חושבת שאי פעם נכנסתי לדירקטוריון שלא ידעתי אם הולכים לאשר את התוכנית או לא' — העבודה המקדימה 'כל כך חשובה'. מדברים מראש, ארבע עיניים על כוס קפה, עם אנשי המפתח בדירקטוריון, כך ש'אין שם הפתעות'. גם מנכ״ל חזק אינו יוצא למהלך גדול בלי קואליציה. זו פוליטיקה ארגונית שקיימת בכל ארגון — עסקי, ציבורי או צבאי."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"מצגת","q":"מנכ״ל חדש נכנס לתפקיד בחברה שנמצאת באמצע תוכנית אסטרטגית רב-שנתית. איזו גישה תואמת את העיקרון 'רציפות, לא קיבעון'?","o":["להמשיך את התוכנית ככתבה וכלשונה, משום שכל שינוי כיוון פוגע באמינות ההנהלה","לבטל את התוכנית הקודמת ולבנות אסטרטגיה חדשה, כדי לסמן את תחילת ההנהגה החדשה","לבחון מה חייב להישמר ומה לגיטימי לפתוח מחדש — לשמור על הכיוון בלי לקבע אותו","להקפיא את כל ההחלטות האסטרטגיות עד סוף השנה הראשונה, כדי ללמוד את הארגון"],"c":2,"e":"בשקף 'הגיע מנכ״ל חדש — אסטרטגיה חדשה?' מוצבת רציפות אסטרטגית מול סדרי עדיפויות חדשים: 'מה חייב להישמר — ומה לגיטימי לפתוח מחדש?', והמסקנה: 'אסטרטגיה צריכה לייצר רציפות, לא קיבעון'. גם כשמנכ״ל חדש עוצר מהלך, הוא בוחן מחדש ולא מוחק את כל מה שנעשה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"מצגת","q":"הנהלה של חברה ותיקה מבקשת 'להיות חדשנית', ומשקיעה בכמה טכנולוגיות בלי לקשור אותן לבעיה מסוימת. מה הביקורת על הגישה?","o":["חדשנות צריכה להיות יעד בפני עצמו, משום שהמיתוג כחברה חדשנית מצדיק כל השקעה","חדשנות מתאימה רק לסטארטאפים, ולכן חברה ותיקה צריכה לרכוש אותה מבחוץ בלבד","חדשנות אינה יעד אלא כלי לפתרון בעיה עסקית — מתחילים מהצורך ומהערך שהיא מביאה","יש להשקיע בחדשנות רק אחרי שכל הבעיות התפעוליות של החברה נפתרו בדרכים אחרות"],"c":2,"e":"'חדשנות היא לא יעד — היא כלי לפתרון בעיה עסקית'. ברזילי: 'אני לא מחפשת להיות חדשנית; אני מחפשת בעזרת חדשנות לפתור בעיות' — כלכליות, תפעוליות או של כוח אדם. גם מיתוג כחברה חדשנית הוא שיקול, אבל צריך לדעת להגיד איזה ערך החדשנות מביאה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"מצגת","q":"יזם מציע מלגזות אוטונומיות, ומנהלי מחסנים מאשרים שקשה להם לגייס מלגזנים. לפי תהליך NEED ← MATCH ← TEST ← SCALE, מה השלב הבא לפני יישום מסחרי?","o":["TEST — ניסוי POC בשטח, שבודק את הפתרון בסביבת העבודה האמיתית","NEED — הגדרה מחדש של הצורך, כך שיתאים לטכנולוגיה שנמצאה","MATCH — חיפוש טכנולוגיה נוספת, כדי להשוות בין שתי חלופות לפחות","SCALE — פריסה בכל האתרים מיד, כדי לחסוך את עלות הניסוי"],"c":0,"e":"תהליך 'מצורך ליישום מסחרי' של Quantum — פלטפורמת החדשנות של תעבורה, חברת האם של ממן: NEED (צורך בשוק) ← MATCH (התאמת טכנולוגיה) ← TEST (POC בשטח) ← SCALE (יישום מסחרי). הצורך כבר זוקק ('מלגזה אני יודע לקנות, מלגזן אי אפשר למצוא') והטכנולוגיה נמצאה, ולכן בודקים אותה בסביבת העבודה האמיתית לפני פריסה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"מצגת","q":"מחסנים אוטומטיים, ספירת מלאי ברחפנים, ניהול מלאי ב-AI ומלגזות אוטונומיות — מה ההשפעה העמוקה של המגמה הזו על שרשרת האספקה?","o":["היא משנה לא רק את הטכנולוגיה, אלא גם את תפקידו של האדם בשרשרת","היא מתאימה רק למחסנים גדולים, ואין לה השפעה על מסופי המטען","היא מייתרת לחלוטין את העובדים בשרשרת האספקה בתוך שנים ספורות","היא משפיעה בעיקר על עלויות האנרגיה, ולא על אופי העבודה במחסן"],"c":0,"e":"בשקף 'לאן הלוגיסטיקה הולכת?': 'יותר אוטומציה, פחות תלות בעבודה ידנית', ובשורה התחתונה: 'אוטומציה משנה לא רק את הטכנולוגיה, אלא גם את תפקידו של האדם בשרשרת האספקה'. בממן ספירת מלאי ברחפנים כבר נעשית על בסיס קבוע."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"מצגת","q":"הנהלה צריכה לחלק 200 מיליון ש״ח בין לוגיסטיקה לתעשיות הביטחון, התרחבות בינלאומית, רכישת חברה משלימה ו-E-commerce. לפי אילו שאלות נכון להכריע?","o":["איזו אפשרות מוכרת לעובדים, כדי להימנע מתהליך מורכב של ניהול שינוי בארגון","איזו אפשרות הכי זולה ליישום, כדי לשמור כמה שיותר מהתקציב כרזרבה לשעת חירום","מה פוטנציאל הצמיחה, מה הסיכון ומה יוצר לחברה יתרון תחרותי — ואז לשכנע את הדירקטוריון","באיזו אפשרות כבר בחרו המתחרים, כדי להקטין את הסיכון באמצעות חיקוי של המובילים בשוק"],"c":2,"e":"בתרגיל: 'ארבע אפשרויות, תקציב אחד', ולכל אחת שלוש שאלות — מה פוטנציאל הצמיחה? מה הסיכון? מה יוצר לממן יתרון תחרותי? — ובסוף: 'נסו לשכנע את הדירקטוריון'. ברזילי הסבירה, למשל, שה-E-commerce לא הוכיח את עצמו לממן בגלל רווחיות נמוכה, ושההתרחבות הבינלאומית נועדה לאזן את זרוע התעופה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"מצגת","q":"איזו תכונה מבחינה בין אסטרטגיה טובה לחלשה, לפי המסר שחתם את ההרצאה?","o":["היא נקבעת פעם אחת בידי הדירקטוריון, ומשם המנכ״ל רק מבצע אותה בשטח","היא חוזה במדויק את מגמות השוק לחמש השנים הבאות ונערכת אליהן מראש","היא נשארת קבועה לאורך כל התקופה, בלי קשר לשינויים בסביבה העסקית","היא בונה ארגון שיודע לקבל החלטות גם כשהעתיד משתנה, ולא מנסה לחזות אותו"],"c":3,"e":"המשפט שחתם את ההרצאה: 'אסטרטגיה טובה אינה חוזה את העתיד — היא בונה ארגון שיודע לקבל החלטות גם כשהעתיד משתנה'. לכן ממן פותחת את האסטרטגיה שלה כל שנה, ועצירה או שינוי כיוון הם חלק לגיטימי מהדרך. הדירקטוריון מאשר את הדרך שהמנכ״ל מציע — הוא לא מתווה אותה."},{"t":"הרצאה 10 · אסטרטגיה ופיתוח עסקי בממן","s":"הרצאה","q":"הנהלה של חברה גדולה ניסחה אסטרטגיה חדשה, ומצרפת לתהליך חברת ייעוץ אסטרטגי יקרה לפני ההצגה לדירקטוריון. מה התועלת העיקרית של המהלך?","o":["היועצים מחליפים את ההנהלה בכתיבת האסטרטגיה, ולכן ההנהלה פטורה מעבודה מקדימה","הייעוץ נועד בעיקר לעמוד בדרישה רגולטורית, בלי השפעה על תוכן האסטרטגיה עצמה ועל היישום","עין חיצונית ונקייה, שנותנת לדירקטוריון ביטחון שהאסטרטגיה אינה רק האג׳נדה של ההנהלה","חברת הייעוץ מבטיחה שהדירקטוריון יאשר את האסטרטגיה בלי שאלות ובלי שיעורי בית"],"c":2,"e":"ברזילי המליצה להיעזר בחברות אסטרטגיה, כמו דלויט, EY או מקינזי — אבל רק אחרי שעשו את העבודה בבית. כשעומדים מול הדירקטוריון ואומרים שחברה כזו הייתה שותפה לכתיבה, זה נותן לו 'נחת רוח' — 'עוד עין נקייה', כשהאסטרטגיה אינה רק האג׳נדה של ההנהלה. דירקטוריון טוב עדיין מאתגר ושולח לשיעורי בית."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"מצגת","q":"חברה ישראלית מייבאת תבואה ודשנים ממדינות הים השחור. לפי 'מטריצת השבריריות הגלובלית' שהוצגה, איזו נקודת חנק היא הסיכון הקריטי עבורה?","o":["המצרים הטורקיים — מסדרון יצוא מרכזי בעולם לתבואה ולדשנים","מצר גיברלטר — מעבר רחב יחסית, שהסיכון בו נמוך עד בינוני","תעלת פנמה — עיקר הסיכון בה אקלימי, והיא מחברת בין האוקיינוס האטלנטי לשקט","מצר הורמוז — עיקר השפעתו על אספקת הנפט והגז בעולם"],"c":0,"e":"במטריצה סומנו המצרים הטורקיים (הים השחור–הים התיכון) כ'קריטי: מסדרון ייצוא מרכזי בעולם לתבואה ודשנים', עם סיכון גבוה — שיט מאתגר (700 מטר, עיקולים) ופגיעות לסכסוכים כמו רוסיה–אוקראינה. שאר התשובות מתארות נכון נקודות חנק אחרות, אבל לא את הסיכון של יבוא מהים השחור."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"מצגת","q":"המעבר בבאב אל-מנדב נחסם, וחברות הספנות מסיטות את קווי אסיה–אירופה סביב אפריקה. מה צפוי לקרות גם בנתיבים שאינם קשורים ישירות לחסימה?","o":["המחירים יירדו בנתיבים האחרים, כי האוניות יעדיפו אותם על פני הנתיב החסום באזור","הקיבולת נשאבת לנתיב הארוך, והעלויות עולות גם בנתיבים רחוקים כמו מלאקה","ההשפעה תישאר מקומית, כי כל נתיב ימי מתומחר ומנוהל בנפרד מהנתיבים האחרים","הביקוש לשינוע ימי יירד, כי חברות יעבירו את רוב המטען שלהן לשינוע אווירי"],"c":1,"e":"בשקף 'שרשרת בהפרעה: התרחיש המצטלב': 'המצרים אינם מבודדים. חסימה בים סוף מאלצת צי עולמי לשנות נתיב, שואבת קיבולת אוניות, ומייקרת את העלויות גם בנתיבים מרוחקים כמו מצר מלאקה וגיברלטר'. המסלול סביב אפריקה מוסיף 10 עד 14 ימי הפלגה, ולפי חליווה ההשפעה מורגשת גם באינפלציה באירופה."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"מצגת","q":"יבואן של רכיבים קריטיים מסתמך על נתיב סחר יחיד דרך תעלת סואץ, ונמנע מלהשקיע בחלופות כי 'זו עלות מיותרת'. מה העמדה שהוצגה בהרצאה?","o":["הוא צודק — נתיב קבוע מאפשר אספקה בזמן, ולכן אפשר לוותר גם על מלאי ביטחון","יש להעביר מיד את כל היבוא לשינוע אווירי קבוע, כדי לעקוף לגמרי את הסיכון הימי","יש לגוון מסלולים מראש — תכנון חלופות אינו עלות, אלא תעודת ביטוח גלובלית","הוא צודק — עדיף להמתין לחסימה הראשונה, ולהפעיל חלופות רק כשיתברר שהן נחוצות"],"c":2,"e":"הצעד הראשון ב'מסיכון לחוסן' הוא גיוון מסלולים מראש: 'לא לסמוך על נתיב סחר בודד לייבוא קריטי. תכנון חלופות אינו עלות, אלא תעודת ביטוח גלובלית'. לצידו — אגירת מלאי אסטרטגי ומודיעין שרשרת אספקה מתמשך."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"מצגת","q":"נמל ישראלי מתחיל לקלוט אוניות גדולות מהמזרח, שחלק מהמכולות שלהן מועברות בנמל לאוניות אחרות בדרך לאירופה — בלי להיכנס לשוק הישראלי. מה המשמעות האסטרטגית של הפעילות הזו?","o":["זה שטעון — הוא מגדיל את נפחי הפעילות ומציב את הנמלים כחוליה בסחר האזורי","זה שינוע יבשתי — המכולות עוברות ברכבת לירדן, ולכן אינן נחשבות לפעילות הנמל","זה יבוא ישיר — המכולות משוחררות במכס בנמל ומגדילות את היצע המוצרים בישראל","זו אחסנה ארוכה בעורף הנמל — המכולות ממתינות עד שהשוק המקומי יזדקק להן"],"c":0,"e":"שטעון (Transshipment) הוא העברת מכולות מאונייה לאונייה בנמל ביניים. בשקף 'הזדמנות גיאופוליטית: מסדרון IMEC והסחר מהמזרח' הוצג יעד של 50% שטעון אזורי — מינוף הסחר מהמזרח כדי להגדיל את הפעילות ולמצב את נמלי ישראל כחוליה המקשרת היבשתית-ימית."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"היום עוברות מירדן לישראל כ-150 משאיות, והיעד הוא אלפים. מדוע התוכנית לנמל היבשתי בנהר הירדן כוללת גם רכבת מהצד הירדני עד חיפה, ולא רק הרחבה של מעבר המשאיות?","o":["הרכבת נועדה להסיע נוסעים בין המדינות, והמטען ימשיך לעבור רק במשאיות","משאיות לבדן לא יגיעו לנפחים של פריקת אוניות — מיליון TEU ויותר בשנה","ההסכמים עם ירדן אוסרים על מעבר משאיות מטען בין שתי המדינות, גם בעתיד","רכבת זולה ממשאית בכל מרחק ובכל נפח, ולכן היא עדיפה תמיד בכל מסלול"],"c":1,"e":"חליווה: 'המטען עובר בעיקר בזכות משאיות, אבל כדי להגיע לקיבולת של אונייה — לפרוק ולהעמיס — צריך רכבת'. לכן מתוכננת רכבת מהצד הירדני עד חיפה, בקומותיים (Double Stack) ובתקן שמתאים לרכבות במפרץ, שתעביר כמיליון עד מיליון וחצי TEU. היתרון אינו שרכבת זולה תמיד, אלא שרק היא מגיעה לנפחים האלה."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"מצגת","q":"מה היתרון האסטרטגי 'עוקף סואץ' של מסדרון IMEC?","o":["העברת כל הסחר מהמזרח לנמל אילת, בלי קשר לנמלי הים התיכון","הרחבת תעלת סואץ עצמה, כדי שתוכל לקלוט אוניות מכולות גדולות יותר","פחות תלות בסואץ — נתיב יבשתי-ימי מהודו והמפרץ, דרך ישראל, לאירופה","קיצור הדרך בין סין לארצות הברית, דרך הים האדום ובהמשך דרך תעלת פנמה"],"c":2,"e":"בשקף 'IMEC — הזדמנויות והשפעות מרכזיות': 'יתרון אסטרטגי — עוקף סואץ: מפחית את התלות בתעלה', לצד שער לאירופה, השקעות תשתית, חיזוק הנורמליזציה האזורית ושדרוג תשתיות אנרגיה ותקשורת. לפי חליווה, המסדרון הוחלט ב-G20 ב-2023 כציר חלופי, גם ליוזמת 'החגורה והדרך' הסינית."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"לפני הרפורמה, שביתה בנמל אשדוד עצרה את כל הסחר במרחב. היום פועלים בכל אחד מהמתחמים, חיפה ואשדוד, כמה מפעילים. מה השתנה עבור היבואנים?","o":["היבואנים מחויבים לפרוק תמיד באותו נמל, לפי המחוז שבו רשומה החברה שלהם","המחירים עלו, משום שכל מפעיל גובה תעריף משלו בלי תקרה ובלי פיקוח של המדינה","דבר לא השתנה, משום שכל המפעילים כפופים לאותו ועד עובדים ולאותה הנהלה","יש תחרות על כל אונייה: המכולות מתחלקות בין הנמלים, אין תורים והמחיר יורד"],"c":3,"e":"חליווה תיאר את המצב לפני הרפורמה — שלושה נמלים, ושביתה באחד מהם שיתקה את המרחב — לעומת היום, כשבכל מתחם פועלים כשבעה מפעילים: 'יש תחרות על כל אונייה שנכנסת, אין תורים, המחיר יורד'. ועדת תעריפים קובעת מחיר מקסימלי, והנמלים סוגרים עסקאות מול היבואנים — 'היום השוק מנצח'."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"חברת נמלי ישראל מתכננת את קיבולת הנמלים עם יתירות של 60% לפחות ועם גיבוי הדדי בין הצפון לדרום, אף שבשגרה חלק מהקיבולת לא מנוצל. מה ההיגיון?","o":["הגדלת הרווחים, כי קיבולת שאינה מנוצלת מושכרת במחיר גבוה למפעילים זרים","חיסכון בעלויות, כי נמל אחד בלבד יכול לנהל את כל תנועת המכולות של המדינה","רציפות תפקודית: גם כשרציף או נמל נפגע, אפשר להעביר, לשקם ולחזור לעבודה","התמחות מלאה: כל המכולות יעברו לנמל אחד וכל הדלקים לנמל השני"],"c":2,"e":"חליווה: הנמלים אמורים לספק את כל צורכי ישראל, ועל השכבה הזאת 'אנחנו מתכננים עם שכבה של יתירות — לפחות 60%', כדי שגם כשיש 'מפגע רציף, מפגע נמל' — 'אנחנו יודעים להעתיק, לשקם, לחזור'. בתכנית האב: 'רציפות תפקודית ויתירות — הקמת מערכי גיבוי הדדיים בין נמלי הצפון והדרום'."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"חברת ספנות צריכה לבחור בין נמל שמבטיח לפרוק את האונייה תוך 24 שעות לבין נמל זול ממנו ב-15% שאינו מתחייב לזמנים. מה צפוי להכריע, לפי מה שהוצג על עולם הנמלים?","o":["הלאום — חברות ספנות מעדיפות נמלים שמופעלים בידי חברות מאותה מדינה","הוודאות — יום עיכוב יקר מאוד, ולכן פריקה מובטחת שווה יותר מההנחה","המחיר — בשוק תחרותי חברות ספנות בוחרות תמיד בנמל הזול ביותר שיש באזור","המרחק — חברות ספנות בוחרות תמיד בנמל הקרוב ביותר ליעד הסופי של המטען"],"c":1,"e":"חליווה: 'הקלף הכי חזק של כל שחקן בעולמות האלה של הנמלים זה ודאות — לא בהכרח מחיר'. אם נמל יודע לפרוק אונייה תוך 24 שעות, 'זה שווה לו הרבה יותר מ-10–20 אחוז', כי אונייה במסלולה 'הדבר האחרון שהיא רוצה זה להתעכב' — יום עיכוב יכול לעלות כ-200 אלף דולר."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"מדוע, לפי מה שהוצג בהרצאה, המדינה מקימה ומפתחת את הנמלים ואת התשתיות, אבל משאירה את הפעלת המסופים למפעילים — לרבות בינלאומיים?","o":["למפעילים עולמיים יש היקף ויכולות תפעול שהמדינה אינה יכולה להתחרות בהם","המפעילים משלמים את כל עלות בניית הנמלים, ולכן המדינה אינה משקיעה בהם דבר","המפעילים הבינלאומיים פטורים ממכס, ולכן הם מוזילים את מחירי היבוא לצרכן","החוק אוסר על המדינה להחזיק בנכסים לאורך קו החוף של הים התיכון"],"c":0,"e":"חליווה: 'המודל שבו אנחנו עובדים הוא מודל של לנדלורד' — חברת נמלי ישראל בעלת הקרקעות והתשתיות, והמפעילים חוכרים ומפעילים. למדינה אין יכולת לנהל אופרציה עסקית ברמה של מפעיל עולמי — המפעיל של נמל הדרום מנהל עוד כ-110 מסופים בעולם וצי של מאות אוניות — ובשנות ה-50 עד ה-70, כשהמדינה ניסתה להפעיל הכול בעצמה, 'זה לא עובד'."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"מנכ״ל רוצה 'להפעיל סוכני AI' בתהליכי הרכש, אבל חלק מהמסמכים עדיין בקלסרים והתהליך מוגדר רק באופן כללי. מה צריך לבוא קודם, לפי הלקחים מפרויקט האוטומציה שהוצג?","o":["רכישת כלי ה-AI המתקדם ביותר בשוק, משום שהוא יסדר בעצמו את המסמכים ואת התהליך","דיגיטציה, הכנת התשתית והגדרת התהליך 'על המילימטר' — אחרת המכונה תנחש","הפעלה מיידית בכל הארגון, משום שמי שמחכה להגדרות מדויקות נשאר מאחור","המתנה של כמה שנים עד שהטכנולוגיה תבשיל, משום שכלי AI עדיין אינם אמינים"],"c":1,"e":"חליווה סיפר על פרויקט RPA שהוביל ב-NICE ב-2021 והסיק: שום כלי לא יעבוד 'אם הכול לא דיגיטלי', צריך להכין את התשתית אפילו כדי להריץ פיילוט, וצריך להגדיר את התהליך 'על המילימטר, לא ליד ולא בערך — כי ליד אתה מקבל ליד'; מכונה שלא הוגדרו לה האפשרויות תנחש, ולפעמים זה הרסני. ומי שחושב שיצטרף בקצב שלו — כבר בפער."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"נמל אילת חזר לעבוד בחודשים האחרונים, אבל כמעט רק כלי רכב נפרקים בו. מה ההסבר שניתן בהרצאה?","o":["רוב הסחר של ישראל עם אסיה עובר כבר היום דרך אילת, והנמל עמוס מכדי לקבל מכולות","המנופים באילת אוטומטיים, והם מותאמים רק לפריקה של כלי רכב מאוניות ייעודיות","נמל אילת מוגבל בחוק לכלי רכב בלבד, ואסור לפרוק בו מכולות או מטען כללי","מאילת צריך להוביל את המטען ביבשה למרכז, ובלי רכבת זה משתלם רק לכלי רכב"],"c":3,"e":"חליווה: מי שמגיע לאילת 'צריך לפרוק את הכול ולהגיע יבשתית למרכז', והיום אין תשתית חיבוריות — 'עד שלא תהיה רכבת, אין מה לדבר על זה'. לכן מה שמשתלם לפרוק באילת הוא רק כלי רכב. אילת היא פחות מ-5% מהסחר של ישראל, ובמצגת מוצגת תוכנית לנמל תעלה צפוני המחובר לרכבת מטען."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"החות׳ים סגרו את באב אל-מנדב. לפי חליווה, מה עיקר ההשפעה של הסגירה?","o":["היא מקצרת את הדרך מאסיה לאירופה, כי האוניות עוברות לנתיב ישיר יותר","היא חוסמת את המעבר מאסיה לאירופה, והאינפלציה מורגשת גם בלונדון ובגרמניה","היא משפיעה רק על מדינות המפרץ, שהנפט שלהן יוצא לעולם דרך המצר הזה בלבד","היא חוסמת את רוב הסחר של ישראל, שמגיע בעיקר דרך נמל אילת ודרך הים האדום"],"c":1,"e":"חליווה: 'באמת מה שעושה באב אל-מנדב — הוא מונע את הכניסה מאסיה לאירופה'. האוניות מקיפות את אפריקה — כשבועיים נוספים, ביטוח ודלק — ולכן גם בלונדון ובגרמניה מרגישים את זה באינפלציה. אילת היא פחות מ-5% מהסחר של ישראל, ורובו מגיע מהים התיכון."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"מנהל שרשרת אספקה עסק שנים בעיקר במיטוב מלאי ובשאלה אם לעבוד עם ספק יחיד. מה, לפי חליווה, צריך להשתנות בחשיבה שלו היום?","o":["להמשיך למזער מלאי בכל מחיר, משום שמלאי עודף הוא הסיכון הגדול ביותר לחברה","להסתמך על החדשות כדי לזהות משברים, ולהגיב אליהם רק כשהם כבר מתרחשים","לעבור לספק יחיד בכל רכיב, כדי לפשט את הניהול ולקבל מחיר נמוך יותר","להבין מאיפה מגיע כל רכיב, מה החלופות ומהו הנתיב הקריטי, ולנתח את הסיכון"],"c":3,"e":"חליווה: 'היום התפיסה של השרשרת השתנתה' — צריך להבין מאיפה הסחורות מגיעות, מה האלטרנטיבות ומה ההשפעה על היכולת להמשיך לייצר, לזהות את הנתיב הקריטי (ואולי לבצע Last Time Buy) ולנתח את הסיכון כחלק מהתכנון. ומודיעין שרשרת אספקה 'לא מסתפק בחדשות' — צריך לשלוט 'עד לרמת הבורג'."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"למה חברת נמלי ישראל מקדמת כבר היום תוכניות לרציפים ולנמלים שיידרשו רק בעוד שנים רבות?","o":["כדי לנצל תקציב שנתי שלא נוצל, שאחרת היה חוזר לאוצר בסוף שנת הכספים","התכנון הסטטוטורי בישראל אורך 7–10 שנים, והתשתית צריכה להיות מוכנה לפני הביקוש","כדי למנוע ממפעילים פרטיים להתחרות בה, משום שהיא רוצה להפעיל את כל הנמלים בעצמה","כי הביקוש למכולות צפוי לרדת, ולכן עדיף לבנות עכשיו כשהמחירים נמוכים"],"c":1,"e":"חליווה השווה: באמירויות הוקמה רכבת של 75 ק״מ תוך 5 שנים מההחלטה, ואצלנו התוכניות הסטטוטוריות לבדן אורכות 7–10 שנים — 'אם לנו תשתית לוקחת 20 שנה ולהם 5–10, מה עשינו?' לכן החברה מתכננת מראש, לפי תחזיות ביקוש, כדי שכל 'מדרגה' של קיבולת תהיה מוכנה לפני שהביקוש מגיע."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"חליווה טען שהפיכת ישראל לצומת סחר היא גם נכס ביטחוני. מה ההיגיון?","o":["מדינות שהסחר שלהן עובר בצומת יאבדו עניין לתקוף אותו, כי הן תלויות בו","סחר ער מבטל את הצורך בהסכמים מדיניים, כי השוק מסדיר לבד את היחסים","צומת סחר מאפשר להטיל מכסים גבוהים על סחורות, ובכסף הזה לממן את הצבא","צומת סחר מחייב נוכחות של צבאות זרים בנמלים, שיגנו על ישראל בשעת חירום"],"c":0,"e":"'אם הייתי שומר את כל החיטה של העולם — מי היה יורה עליי?' לדבריו, אם ישראל תהיה צומת שממנו יוצאים לאירופה וחוזרים ממנה, האינטרס של מדינות לתקוף אותה ירד משמעותית, כי הן יהיו תלויות בה. לכן הוא רואה בדרכים העוקפות שמקדמות מדינות באזור איום אסטרטגי."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"הרצאה","q":"ארגון רוצה להטמיע רובוטים (RPA) בתהליכי הרכש. לפי הלקחים שהוצגו, מה צריך להיות קיים עוד לפני שמדברים על הטכנולוגיה?","o":["גיבוי של המנכ״ל, קוד אתי, ומדיניות ותהליכים מוגדרים — ורק אחר כך הכלים","תקציב פתוח לרכישת רישיונות, בלי צורך לאשר מראש את היעדים, את ההיקף ואת לוח הזמנים","הסכמה של כל העובדים בארגון, ורק אחרי הצבעה על כל תהליך בנפרד","צוות פיתוח פנימי גדול, משום שאי אפשר להטמיע RPA עם ספק חיצוני"],"c":0,"e":"חליווה הציג את הבסיס מפרויקט ה-RPA ב-NICE: גיבוי של ה-CEO, קוד אתי, 'מה אתם רוצים לנהל', מדיניות ותהליכים — 'יש לכם עוד הרבה עבודה' עד שמגיעים לטכנולוגיה. ואחר כך: דיגיטציה של המידע, הכנת התשתית והגדרת התהליך 'על המילימטר'."},{"t":"הרצאה 11 · נמלים, סחר ו-IMEC","s":"מצגת","q":"לפי מטריצת השבריריות, מה מייחד את הסיכון בתעלת פנמה לעומת רוב נקודות החנק האחרות?","o":["סיכון של חסימה פיזית בידי אונייה תקועה, כמו שקרה ל-Ever Given","סיכון אקלימי — התעלה תלויה במים מתוקים, ובצורות מגבילות את מספר המעברים","סיכון של פיראטיות וטרור, כמו בבאב אל-מנדב, שמאיים על כל אונייה שעוברת בה","סיכון נמוך במיוחד, משום שזו התעלה היחידה בעולם שאין בה אגרות מעבר"],"c":1,"e":"במטריצה סומן לתעלת פנמה 'סיכון אקלימי': 5–6% מהסחר, תלות במים מתוקים — בצורות מגבילות מעברים. לכן הצעד השלישי ב'מסיכון לחוסן' דורש לעקוב גם אחר מגמות אקלים, ולא רק אחר איומים ביטחוניים. חסימה פיזית (Ever Given) היא הסיכון שסומן לתעלת סואץ."},{"t":"מאמר · פרדוקס הטכנולוגיה","s":"מאמר","q":"חברות משקיעות מיליארדים במערכות AI לשרשרת האספקה, אך רק כרבע מהן מגיעות ליישום אסטרטגי אמיתי. מה הסיבה המרכזית לפי המאמר 'פרדוקס הטכנולוגיה'?","o":["העלות גבוהה מדי, ולכן רוב החברות אינן מסוגלות לממן יישום מלא של המערכות","העובדים מסרבים להשתמש במערכות, ולכן יש להחליף אותם בעובדים צעירים יותר","החסם ניהולי ולא טכנולוגי – 'הדבקה' של כלי AI מתקדמים על תהליכי עבודה ישנים","הטכנולוגיה עדיין אינה בשלה, ולכן יש להמתין עד שכלי ה-AI יגיעו לרמה מספקת"],"c":2,"e":"הפרדוקס שמתואר במאמר: השקעות עתק ב-AI לצד יישום אסטרטגי נמוך. לפי הנתונים שהוא מביא, החסם אינו הטכנולוגיה עצמה אלא הניהול – והטעות הנפוצה היא להלביש כלים מתקדמים על תהליכים ישנים. זה מתחבר ל'כשל ממוחשב' מהרצאה 9: מחשוב של תהליך לקוי אינו פותר אותו."},{"t":"מאמר · פרדוקס הטכנולוגיה","s":"מאמר","q":"מה המשמעות של עידן ה-Permacrisis לניהול שרשרת האספקה, לפי המאמר?","o":["משברים גלובליים משפיעים רק על חברות בינלאומיות, ולא על שרשראות מקומיות","אירועי קיצון הפכו לשגרה – מיעילות להסתגלות, ומ-JIT ל-JIC","משברים הפכו לנדירים יותר, ולכן אפשר לחזור לניהול רזה המבוסס על JIT","יש להקפיא השקעות בטכנולוגיה עד שתחזור השגרה ויתבהרו המגמות בשוק"],"c":1,"e":"לפי המאמר, 'השגרה' נעלמה: מלחמות, חסימות של מיצרי ים ומתיחות בין גושים אינם עוד 'ברבורים שחורים' נדירים. לכן מיקוד הניהול עובר מיעילות (Efficiency) ליכולת הסתגלות (Adaptability), ובמלאי – מ-Just in Time ל-Just in Case מנוהל. זה תואם את 'שינוי הפרדיגמה הגלובלי' שהוצג בהרצאות 1–2."},{"t":"מאמר · פרדוקס הטכנולוגיה","s":"מאמר","q":"מחלקות המכירות, הייצור והרכש בחברה עובדות עם מערכות נפרדות ועם מדדי KPI סותרים, והארגון נמצא ב'כיבוי שריפות' מתמיד. מה הבעיה לפי המאמר, ומה כיוון הפתרון?","o":["עודף טכנולוגיה; הפתרון – צמצום מספר המערכות לגיליון אחד משותף לכולם","סילוסים ארגוניים; הפתרון – תכנון משולב (IBP) שמאזן ביקוש מול אספקה","חוסר תקציב; הפתרון – קיצוץ תקנים שווה בשווה בכל המחלקות בארגון","מחסור בכוח אדם; הפתרון – גיוס עובדים נוספים לכל מחלקה עד שהעומס יירד"],"c":1,"e":"המאמר מזהה את החולשה המרכזית כארגונית: מחלקות מבודדות (Silos) עם מערכות נפרדות ומדדים מנוגדים, שמכניסות את המערכת כולה ל'כיבוי שריפות'. הפתרון אינו קיצוץ תקנים פשטני אלא איזון דינמי בין ביקוש השוק ליכולת האספקה – למשל ב-IBP. זה מזכיר את מקרה שטראוס מהרצאה 9: תכנון משותף של מכירות, ייצור ולוגיסטיקה."},{"t":"מאמר · פרדוקס הטכנולוגיה","s":"מאמר","q":"חברה רוצה לראות בכל רגע היכן נמצאת כל הזמנה לאורך השרשרת, מקצה לקצה, ולזהות עיכובים בזמן אמת. איזה כלי מהמאמר מתאים לה?","o":["מיפוי אקוסיסטם (Ecosystem Mapping)","העברת ייצור למדינות ידידותיות","למידת עמיתים (Peer Learning)","מגדל פיקוח (Control Tower)"],"c":3,"e":"בין הפתרונות שהמאמר מציג: מגדלי פיקוח – ראייה מקצה לקצה של השרשרת בזמן אמת; מודלי IBP וסימולציות קיצון בתאומים דיגיטליים; מיפוי אקוסיסטם ו-IoT לזיהוי מוקדם של חולשת ספק; ו-Agentic AI. למידת עמיתים היא דרך ללמוד ממקרים של ארגונים אחרים, ולא כלי תפעולי."},{"t":"מאמר · פרדוקס הטכנולוגיה","s":"מאמר","q":"חברה מעבירה חלק מהייצור מספק יחיד במדינה רחוקה אל כמה מדינות ידידותיות. איך נקראת המגמה לפי המאמר, ומה מטרתה?","o":["Just in Time – צמצום המלאי אצל הספקים, כדי להקטין את ההון החוזר של החברה","Kitting – הרכבת ערכות ממקורות שונים, כדי לשלוח ללקוח משלוח אחד בלבד","Friend-Shoring – פיזור הייצור למדינות ידידותיות, לצמצום סיכון גאופוליטי","Off-Shoring – העברת הייצור למדינה הזולה ביותר, כדי למקסם את הרווחיות בכל מחיר"],"c":2,"e":"המאמר מתאר את מגמת ה-Friend-Shoring: פיזור הייצור למדינות בעלות ברית במקום תלות בספק יחיד, כחלק מההסתגלות לעידן של משבר מתמשך. זה מתיישב עם עקרון הרשת מהקורס – לפחות שני מקורות לכל מצרך – ועם Dual/Near Sourcing שהוצגו בהרצאות 1–2."},{"t":"מאמר · פרדוקס הטכנולוגיה","s":"מאמר","q":"מה תפקידו של Agentic AI בשרשרת האספקה, לפי המאמר?","o":["כלים אוטונומיים שמשלימים את המנהל ופועלים 'בין הסילוסים', והאדם מכוון אסטרטגיה","כלים שמחליפים את מערכות ה-ERP, ולכן מייתרים את הצורך באינטגרציה בין מערכות","כלים שמיועדים לשיווק בלבד, ולכן אין להם תפקיד בניהול התפעול או בתכנון","כלים שמחליפים את מנהלי שרשרת האספקה, כך שההחלטות מתקבלות בלי מעורבות אנושית"],"c":0,"e":"לפי המאמר, Agentic AI הם כלים אוטונומיים שמשלימים – ולא מחליפים – את המנהל: הם יושבים בין הסילוסים ומחברים ביניהם, בעוד ההון האנושי מכוון את האסטרטגיה ומנהל סיכונים גאופוליטיים. זו אותה רוח של תעשייה 5.0: הטכנולוגיה כמכפיל כוח, והאדם במרכז."},{"t":"מאמר · פרדוקס הטכנולוגיה","s":"מאמר","q":"לפי המסקנה של המאמר, מה השתנה במעמדה של שרשרת האספקה בארגון?","o":["היא עברה במלואה למיקור חוץ, משום שחברות מתמקדות רק בליבה העסקית שלהן","היא הפכה לחלק ממחלקת הכספים, משום שעיקר האתגר בה הוא תקציבי בלבד","היא עברה מפונקציה תפעולית 'מוציאה לפועל' ללב האסטרטגיה העסקית של הארגון","היא הפכה לפונקציה משנית, משום שהאוטומציה מבצעת היום את רוב פעולותיה"],"c":2,"e":"המאמר מסכם שהימים שבהם שרשרת האספקה הייתה פונקציה תפעולית שרק 'מוציאה לפועל' חלפו – היום היא לב האסטרטגיה העסקית. הוא מדגיש גם את הערך של למידת עמיתים (Peer Learning) ממקרי אמת של ארגונים אחרים – בדיוק הרעיון של הרצאות האורח בקורס."}];

"use strict";
var LET=["א","ב","ג","ד"];
var SRC_META={
  "שאלות הכיתה":{bg:"var(--warnBg)",fg:"var(--warnTx)",full:"שאלת הכיתה · אושרה בידי המרצה"},
  "מצגת":{bg:"var(--clsBg)",fg:"var(--clsTx)",full:"ממצגת ההרצאה"},
  "הרצאה":{bg:"var(--clsBg)",fg:"var(--clsTx)",full:"מהקלטת ההרצאה"},
  "מילון":{bg:"var(--surface2)",fg:"var(--muted)",full:"ממילון המושגים המאושר"},
  "מאמר":{bg:"var(--surface2)",fg:"var(--muted)",full:"ממאמר הקריאה"}
};
var OUT_OF_SCOPE="__none__";
var app=document.getElementById("app");
var TOPICS=[]; (function(){var s={};BANK.forEach(function(b){if(!s[b.t]){s[b.t]=1;TOPICS.push(b.t);}}); })();
var SOURCES=[]; (function(){var s={};BANK.forEach(function(b){if(!s[b.s]){s[b.s]=1;SOURCES.push(b.s);}}); })();

var sel={topics:TOPICS.slice(),src:"exam",mode:"practice",shuffle:true,minutes:0,count:25,pcount:20,balanced:true};
var quiz=[],idx=0,ansMap=[],timer=null,timeLeft=0;   /* ansMap[i] = התשובה שנבחרה לשאלה i */

function E(tag,attr,html){var e=document.createElement(tag);if(attr)for(var k in attr)e.setAttribute(k,attr[k]);if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* היקפים. "שאלות הכיתה" הן השאלות שהסטודנטים כתבו והמרצה אישר באפליקציה
   המשותפת. המרצה אמר בהרצאה הראשונה ששאלות איכותיות ייכנסו למבחן, ולכן
   הן הקרובות ביותר לנוסח האמיתי. */
var SCOPE={
  core:{name:"שאלות הכיתה",  hint:"השאלות שהמרצה אישר באפליקציה של הכיתה. לדבריו, שאלות איכותיות ייכנסו למבחן",
        f:function(s){return s==="שאלות הכיתה";}},
  exam:{name:"כל החומר",     hint:"כל ההרצאות: מצגות, הקלטות, המילון המאושר ומאמר הקריאה, יחד עם שאלות הכיתה",
        f:function(){return true;}}
};
function srcOK(s){ return SCOPE[sel.src] ? SCOPE[sel.src].f(s) : s===sel.src; }
function filterBank(){return BANK.filter(function(x){return sel.topics.indexOf(x.t)>=0 && srcOK(x.s);});}
function countScope(k){return BANK.filter(function(x){return SCOPE[k].f(x.s);}).length;}

/* אחרי הגדרת SCOPE — הכותרת מונה את שאלות ההיקף, לא את כל המאגר. */
document.getElementById("sub").textContent =
  BANK.length+" שאלות מכל ההרצאות. המבחן: אמריקאי, 20–30 שאלות מכל ההרצאות, בחומר פתוח מודפס בלבד. ציון עובר: 60.";
/* מערבב את סדר התשובות בכל שאלה, כדי שהתשובה הנכונה לא תהיה תמיד באותו מקום */
function prepQ(q){
  var order=shuffle([0,1,2,3]);
  var opts=order.map(function(i){return q.o[i];});
  return {t:q.t,s:q.s,q:q.q,o:opts,c:order.indexOf(q.c),e:q.e};
}
function buildQuiz(){
  var arr=filterBank().map(prepQ);
  if(sel.shuffle)shuffle(arr);
  return arr;
}
function srcBg(s){return (SRC_META[s]||{}).bg||"var(--surface2)";}
function srcFg(s){return (SRC_META[s]||{}).fg||"var(--muted)";}
function countBy(key,val){return BANK.filter(function(b){return b[key]===val;}).length;}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}

/* ---------- theme ---------- */
function initTheme(){
  var t=null;try{t=localStorage.getItem("i40q_theme");}catch(e){}
  if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  var isDark = cur==="dark" || (cur!=="light" && window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
  var nx=isDark?"light":"dark";
  document.documentElement.setAttribute("data-theme",nx);
  try{localStorage.setItem("i40q_theme",nx);}catch(e){}
}
initTheme();

/* ---------- setup screen ---------- */
function setup(){
  stopTimer();
  app.innerHTML="";
  var c=E("div",{"class":"card"});

  c.appendChild(E("div",{"class":"note"},
    "<b>המבחן: כ-20–30 שאלות אמריקאיות מכל ההרצאות.</b> החומר פתוח, אבל מודפס בלבד: אין מחשב ואין טלפון באולם. "+
    "המרצה הדגיש שזה מבחן הבנה ולא זיכרון, ושהוא ממוקד במקרי הבוחן.<br>"+
    "<b>איך לתרגל:</b> ב<b>מצב תרגול</b> מקבלים משוב והסבר אחרי כל שאלה, ובסוף הסבב אפשר לתרגל רק את השגויות. "+
    "ב<b>סימולציית מבחן</b> עונים על 25 שאלות מפוזרות בין ההרצאות, ורק בסוף מקבלים ציון וסקירה של כל שגיאה.<br>"+
    "<b>מאיפה להתחיל:</b> בהיקף <b>שאלות הכיתה</b>. אלה השאלות שהמרצה כבר אישר."));

  /* mode */
  var row1=E("div",{"class":"toolbar"});
  row1.appendChild(E("span",{"class":"lbl"},"מצב:"));
  [["practice","תרגול עם הסברים"],["exam","סימולציית מבחן"]].forEach(function(m){
    var b=E("button",{"class":"chip"+(sel.mode===m[0]?" active":"")},m[1]);
    b.onclick=function(){sel.mode=m[0];setup();};
    row1.appendChild(b);
  });
  var sp=E("span",{"class":"spacer"});row1.appendChild(sp);
  var th=E("button",{"class":"iconbtn"},"מצב כהה / בהיר");
  th.onclick=toggleTheme;row1.appendChild(th);
  c.appendChild(row1);

  /* topics */
  var row2=E("div",{"class":"toolbar"});
  row2.appendChild(E("span",{"class":"lbl"},"נושאים:"));
  var allOn=sel.topics.length===TOPICS.length;
  var ball=E("button",{"class":"chip"+(allOn?" active":"")},"הכל");
  ball.onclick=function(){sel.topics=allOn?[]:TOPICS.slice();setup();};
  row2.appendChild(ball);
  TOPICS.forEach(function(t){
    var on=sel.topics.indexOf(t)>=0;
    var b=E("button",{"class":"chip"+(on?" active":"")},t+" <small>"+countBy("t",t)+"</small>");
    b.onclick=function(){
      var i=sel.topics.indexOf(t);
      if(i>=0)sel.topics.splice(i,1);else sel.topics.push(t);
      setup();
    };
    row2.appendChild(b);
  });
  c.appendChild(row2);

  /* היקף לימוד */
  var row0=E("div",{"class":"toolbar"});
  row0.appendChild(E("span",{"class":"lbl"},"היקף:"));
  ["core","exam"].forEach(function(k){
    var b=E("button",{"class":"chip"+(sel.src===k?" active":"")},
      SCOPE[k].name+" <small>"+countScope(k)+"</small>");
    b.onclick=function(){sel.src=k;setup();};
    row0.appendChild(b);
  });
  /* בעבר הופיעו כאן גם כפתורים לכל מקור בנפרד. הם היו כפילות של
     ההיקפים ורק הוסיפו רעש, ולכן נמחקו. */
  c.appendChild(row0);
  if(SCOPE[sel.src])
    c.appendChild(E("div",{"class":"scopehint"},SCOPE[sel.src].hint));

  /* options */
  var row4=E("div",{"class":"toolbar"});
  row4.appendChild(E("span",{"class":"lbl"},"אפשרויות:"));
  var sh=E("button",{"class":"chip"+(sel.shuffle?" active":"")},"ערבוב שאלות");
  sh.onclick=function(){sel.shuffle=!sel.shuffle;setup();};
  row4.appendChild(sh);
  if(sel.mode==="practice"){
    /* אורך סבב: בלי הגבלה צריך לענות על כל המאגר כדי להגיע למסך התוצאות,
       ורק שם מופיע הכפתור לתרגול השגויות. סבב קצר הופך אותו לשמיש. */
    [[20,"סבב של 20"],[40,"סבב של 40"],[0,"כל השאלות"]].forEach(function(n){
      var b=E("button",{"class":"chip"+(sel.pcount===n[0]?" active":"")},n[1]);
      b.onclick=function(){sel.pcount=n[0];setup();};
      row4.appendChild(b);
    });
  }
  if(sel.mode==="exam"){
    var bal=E("button",{"class":"chip"+(sel.balanced?" active":"")},"פריסה מאוזנת בין נושאים");
    bal.onclick=function(){sel.balanced=!sel.balanced;setup();};
    row4.appendChild(bal);
    [[25,"25 שאלות, כמו במבחן"],[40,"40 שאלות"],[0,"הכל"]].forEach(function(n){
      var b=E("button",{"class":"chip"+(sel.count===n[0]?" active":"")},n[1]);
      b.onclick=function(){sel.count=n[0];setup();};
      row4.appendChild(b);
    });
    [[0,"בלי שעון"],[30,"30 דק'"],[45,"45 דק'"],[60,"60 דק'"]].forEach(function(m){
      var b=E("button",{"class":"chip"+(sel.minutes===m[0]?" active":"")},m[1]);
      b.onclick=function(){sel.minutes=m[0];setup();};
      row4.appendChild(b);
    });
  }
  c.appendChild(row4);

  var n=filterBank().length;
  var info=E("div",{"class":"stats"});
  info.innerHTML="<span>נבחרו <b>"+n+"</b> שאלות</span>";
  c.appendChild(info);

  var go=E("button",{"class":"btn btn-pri"},
    sel.mode==="exam"?"התחלת סימולציית מבחן":"התחלת תרגול");
  go.style.width="100%";
  if(n===0){go.disabled=true;go.textContent="בחרו לפחות נושא אחד";}
  go.onclick=function(){ sel.mode==="exam"?examStart():practiceStart(); };
  c.appendChild(go);

  /* הדפסה — המבחן פתוח-חומר, ולכן אפשר להיכנס איתו לכיתה */
  var pr=E("div",{"class":"toolbar"});
  pr.style.marginTop="12px";
  pr.appendChild(E("span",{"class":"lbl"},"הדפסה:"));
  var p1=E("button",{"class":"iconbtn"},"🖨 השאלות עם התשובות");
  p1.onclick=function(){printSheet(true);};
  var p2=E("button",{"class":"iconbtn"},"🖨 השאלות בלבד");
  p2.onclick=function(){printSheet(false);};
  p1.disabled=p2.disabled=n===0;
  pr.appendChild(p1);pr.appendChild(p2);
  c.appendChild(pr);
  c.appendChild(E("div",{"class":"scopehint"},
    "מדפיס את "+n+" השאלות שנבחרו למעלה — לפי הנושאים וההיקף. "+
    "אפשר להכניס את הדף המודפס למבחן, כי החומר פתוח."));

  app.appendChild(c);
}

/* ---------- גיליון הדפסה ---------- */
/* נבנה אל תוך #print, שמוסתר במסך ומוצג רק בהדפסה. כך אין צורך
   בחלון חדש (שחוסמי חלונות קופצים עוצרים) והעיצוב נשאר בקובץ אחד. */
function printSheet(withAnswers){
  var arr=filterBank();
  if(!arr.length)return;
  var box=document.getElementById("print");
  box.className = withAnswers ? "" : "cols";   /* בלי תשובות — צפוף יותר, שתי עמודות */
  var esc=function(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;};
  var h='<div class="prhead"><h2>בוחן תרגול — Industry 4.0</h2><div>'+
        arr.length+" שאלות · "+(SCOPE[sel.src]?SCOPE[sel.src].name:sel.src)+
        " · "+(withAnswers?"עם תשובות והסברים":"ללא תשובות")+"</div></div>";
  arr.forEach(function(q,i){
    h+='<div class="pq"><div class="pt">'+esc(q.t)+
       (q.s===OUT_OF_SCOPE?' · <b>⚠ מחוץ להיקף המבחן</b>':'')+'</div>'+
       '<div><span class="pn">'+(i+1)+'.</span> '+esc(q.q)+'</div>';
    q.o.forEach(function(o,k){ h+='<div class="po">'+LET[k]+". "+esc(o)+"</div>"; });
    if(withAnswers)
      h+='<div class="po pa">✔ '+LET[q.c]+". "+esc(q.o[q.c])+'</div>'+
         '<div class="po pe">'+esc(q.e)+"</div>";
    h+="</div>";
  });
  box.innerHTML=h;
  window.print();
}

/* ---------- shared bits ---------- */
function bar(frac){
  var b=E("div",{"class":"bar"});
  b.innerHTML='<i style="width:'+(frac*100)+'%"></i>';
  return b;
}
function metaRow(q){
  var r=E("div",{"class":"qmeta"});
  r.innerHTML='<span class="pill">'+q.t+'</span><span class="pill" style="background:'+srcBg(q.s)+';color:'+srcFg(q.s)+'">'+((SRC_META[q.s]||{}).full||q.s)+'</span>';
  return r;
}
function topBar(extraHtml){
  var t=E("div",{"class":"toolbar"});
  var back=E("button",{"class":"iconbtn"},"→ חזרה להגדרות");
  back.onclick=function(){
    if(!timer||back.getAttribute("data-sure")){setup();return;}
    back.setAttribute("data-sure","1");back.textContent="לחצו שוב כדי לצאת — התשובות לא יישמרו";
  };
  t.appendChild(back);
  t.appendChild(E("span",{"class":"spacer"}));
  if(extraHtml)t.appendChild(E("span",{},extraHtml));
  var th=E("button",{"class":"iconbtn"},"◐");
  th.onclick=toggleTheme;t.appendChild(th);
  return t;
}

/* ---------- practice mode ---------- */
/* אפשר לעבור בחופשיות בין השאלות: «הקודמת», «הבאה» ומפת שאלות. תשובה שנבחרה נשמרת,
   וכשחוזרים לשאלה רואים שוב את הסימון ואת ההסבר. */
function practiceStart(){
  quiz=buildQuiz();
  /* אותה דגימה מאוזנת של המבחן — סבב קצר שמרוכז בשניים-שלושה נושאים
     אינו מייצג, והמאגר אינו מאוזן בין הנושאים. */
  if(sel.pcount&&quiz.length>sel.pcount)
    quiz=shuffle(balancedPick(quiz,sel.pcount));
  pBegin();
}
function pBegin(){idx=0;ansMap=new Array(quiz.length);pRender();}
function pTally(){
  var ok=0,bad=[],n=0;
  quiz.forEach(function(q,i){ if(ansMap[i]==null)return; n++; if(ansMap[i]===q.c)ok++; else bad.push(q); });
  return {ok:ok,bad:bad,n:n};
}
/* כפתור שמסיים את הסבב. אם נשארו שאלות בלי מענה, הלחיצה הראשונה רק מזהירה —
   כמו בהגשת המבחן, בלי חלון קופץ. */
function pFinish(b,T){
  b.onclick=function(){
    var un=quiz.length-T.n;
    if(un>0&&!b.getAttribute("data-sure")){
      b.setAttribute("data-sure","1");
      b.textContent="נותרו "+un+" שאלות בלי מענה — לחצו שוב כדי לסיים";
      return;
    }
    pResults();
  };
}
function pRender(keepScroll){
  var q=quiz[idx],a=ansMap[idx],done=a!=null,T=pTally(),last=idx===quiz.length-1;
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar());
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span>"+
    "<span>נכונות: <b>"+T.ok+"</b></span>"+
    "<span>שגויות: <b>"+T.bad.length+"</b></span>"+
    "<span class='spacer'></span><span>הצלחה: <b>"+(T.n?Math.round(T.ok/T.n*100)+"%":"—")+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(T.n/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var cls="opt";
    if(done)cls+=" locked"+(i===q.c?" correct":i===a?" wrong":"");
    var b=E("button",{"class":cls});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ if(ansMap[idx]!=null)return; ansMap[idx]=i; pRender(true); };
    box.appendChild(b);
  });
  c.appendChild(box);
  if(done){
    var ex=E("div",{"class":"expl"});
    ex.innerHTML='<span class="tag">'+(a===q.c?"נכון · ":"התשובה הנכונה: "+LET[q.c]+" · ")+'</span>'+q.e;
    c.appendChild(ex);
  }

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;
  prev.onclick=function(){idx--;pRender();};
  var next=E("button",{"class":"btn"+(done?" btn-pri":"")},last?"סיום וצפייה בציון":done?"השאלה הבאה ←":"דילוג ←");
  if(last)pFinish(next,T); else next.onclick=function(){idx++;pRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},
    "מפת שאלות — לחצו כדי לעבור לשאלה · ירוק: נכונה · אדום: שגויה"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(qq,i){
    var m=ansMap[i]==null?"":ansMap[i]===qq.c?" ok":" bad";
    var b=E("button",{"class":"pbtn"+m+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;pRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);
  if(!last){
    var fin=E("button",{"class":"btn"},"סיום הסבב וצפייה בציון");
    fin.style.width="100%";fin.style.marginTop="14px";
    pFinish(fin,T);
    c.appendChild(fin);
  }
  app.appendChild(c);
  if(!keepScroll)window.scrollTo(0,0);
}
function pResults(){
  var T=pTally();
  results(T.ok,quiz.length,T.bad,practiceStart,function(){
    quiz=T.bad.slice();if(sel.shuffle)shuffle(quiz);
    pBegin();
  },null);
}

/* מקלדת, במסך של שאלה: חץ שמאלה = הבאה, חץ ימינה = הקודמת (האתר מימין לשמאל), 1-4 = בחירת תשובה */
document.addEventListener("keydown",function(ev){
  if(!app.querySelector(".qtext")||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  var bs=app.querySelectorAll(".nav .btn");
  if(ev.key==="ArrowLeft"&&bs[1]&&!bs[1].disabled){ev.preventDefault();bs[1].click();}
  else if(ev.key==="ArrowRight"&&bs[0]&&!bs[0].disabled){ev.preventDefault();bs[0].click();}
  else if(/^[1-4]$/.test(ev.key)){
    var o=app.querySelectorAll(".opt")[+ev.key-1];
    if(o&&o.className.indexOf("locked")<0){ev.preventDefault();o.click();}
  }
});

/* ---------- exam mode ---------- */
/* דגימה מאוזנת בין נושאים: המאגר אינו מאוזן (יש נושאים עם יותר שאלות
   מאחרים, לפי כמה חומר יש עליהם), ולכן דגימה אקראית פשוטה תיתן מבחן
   שרובו שניים-שלושה נושאים. כאן לוקחים לסירוגין מכל נושא בתורו. */
function balancedPick(arr,n){
  var byTopic={},order=[];
  arr.forEach(function(q){ if(!byTopic[q.t]){byTopic[q.t]=[];order.push(q.t);} byTopic[q.t].push(q); });
  var out=[],i=0;
  while(out.length<n){
    var added=false;
    for(var k=0;k<order.length&&out.length<n;k++){
      var pool=byTopic[order[k]];
      if(i<pool.length){ out.push(pool[i]); added=true; }
    }
    if(!added)break;      /* מוצו כל הנושאים */
    i++;
  }
  return out;
}
function examStart(){
  quiz=buildQuiz();
  if(sel.count&&quiz.length>sel.count)
    quiz=sel.balanced?shuffle(balancedPick(quiz,sel.count)):quiz.slice(0,sel.count);
  idx=0;ansMap=new Array(quiz.length);
  timeLeft=sel.minutes*60;
  if(sel.minutes)startTimer();
  eRender();
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    timeLeft--;
    var el=document.getElementById("clock");
    if(el)el.textContent=fmt(timeLeft);
    if(timeLeft<=0){stopTimer();examSubmit(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function eRender(){
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar(sel.minutes?'זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':""));
  var nAns=0;for(var i=0;i<ansMap.length;i++)if(ansMap[i]!=null)nAns++;
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span><span>נענו: <b>"+nAns+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(nAns/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"+(ansMap[idx]===i?" picked":"")});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ansMap[idx]=i;eRender();};
    box.appendChild(b);
  });
  c.appendChild(box);

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;prev.onclick=function(){idx--;eRender();};
  var next=E("button",{"class":"btn btn-pri"},"הבאה ←");
  next.disabled=idx===quiz.length-1;next.onclick=function(){idx++;eRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},"מפת שאלות — לחצו כדי לעבור לשאלה · מסומנות: שאלות שנענו"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(_,i){
    var b=E("button",{"class":"pbtn"+(ansMap[i]!=null?" ans":"")+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;eRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);

  var sub=E("button",{"class":"btn btn-pri"},"הגשת המבחן");
  sub.style.width="100%";sub.style.marginTop="14px";
  sub.onclick=function(){
    var un=quiz.length-nAns;
    if(un>0&&!sub.getAttribute("data-sure")){
      sub.setAttribute("data-sure","1");
      sub.textContent="נותרו "+un+" שאלות ללא מענה — לחצו שוב כדי להגיש";
      return;
    }
    examSubmit(false);
  };
  c.appendChild(sub);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function examSubmit(auto){
  stopTimer();
  var sc=0,wr=[];
  quiz.forEach(function(q,i){ if(ansMap[i]===q.c)sc++; else wr.push({q:q,given:ansMap[i]}); });
  results(sc,quiz.length,wr.map(function(x){return x.q;}),examStart,null,wr,auto);
}

/* ---------- results ---------- */
function results(sc,total,wr,onAgain,onRetryWrong,detail,auto){
  stopTimer();
  app.innerHTML="";
  var pct=total?Math.round(sc/total*100):0;
  var c=E("div",{"class":"card result"});
  if(auto)c.appendChild(E("div",{"class":"note"},"<b>הזמן נגמר</b> — המבחן הוגש אוטומטית."));
  c.appendChild(E("div",{"class":"big"},pct));
  var g = pct>=90?"מצוין — שליטה מלאה בחומר":
          pct>=80?"טוב מאוד":
          pct>=70?"טוב — כדאי לחזור על הנושאים החלשים":
          pct>=60?"עובר — מומלץ לחזור ולתרגל":
                  "מתחת לציון עובר — כדאי לחזור על החומר ולתרגל שוב";
  c.appendChild(E("div",{"class":"grade"},sc+" מתוך "+total+" · "+g));

  var nav=E("div",{"class":"nav"});
  var again=E("button",{"class":"btn btn-pri"},"סבב חדש");
  again.onclick=onAgain;nav.appendChild(again);
  if(onRetryWrong&&wr.length){
    var rw=E("button",{"class":"btn"},"תרגול "+wr.length+" השגויות");
    rw.onclick=onRetryWrong;nav.appendChild(rw);
  }
  var home=E("button",{"class":"btn"},"הגדרות");
  home.onclick=setup;nav.appendChild(home);
  c.appendChild(nav);
  app.appendChild(c);

  if(detail&&detail.length){
    var d=E("div",{"class":"card"});
    d.appendChild(E("div",{"class":"ptitle"},"סקירת "+detail.length+" השאלות שנענו לא נכון"));
    detail.forEach(function(x){
      var r=E("div",{"class":"rev"});
      var given = x.given==null?"<i>לא נענתה</i>":LET[x.given]+". "+x.q.o[x.given];
      r.innerHTML='<div class="rq">'+x.q.q+'</div>'+
        '<div class="ra">התשובה שלך: '+given+'</div>'+
        '<div class="rc">התשובה הנכונה: '+LET[x.q.c]+". "+x.q.o[x.q.c]+'</div>'+
        '<div style="margin-top:6px;color:var(--muted)">'+x.q.e+'</div>';
      d.appendChild(r);
    });
    app.appendChild(d);
  } else if(wr.length){
    var d2=E("div",{"class":"card"});
    d2.appendChild(E("div",{"class":"ptitle"},"נושאים לחזרה"));
    var byTopic={};
    wr.forEach(function(q){byTopic[q.t]=(byTopic[q.t]||0)+1;});
    var ul=E("div",{"class":"toolbar"});
    Object.keys(byTopic).forEach(function(t){
      ul.appendChild(E("span",{"class":"pill"},t+" — "+byTopic[t]+" שגיאות"));
    });
    d2.appendChild(ul);
    app.appendChild(d2);
  }
  window.scrollTo(0,0);
}

setup();
})();
</script>
</body>
</html>
